<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday, My Love 🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Romantic Rose & Blush Palette */
      --bg-start: #fff0f5;
      --bg-end: #ffe4e9;
      --accent: #d4788e;
      --accent-dark: #b35a72;
      --text-primary: #4a303a;
      --text-soft: #7a5a65;
      --card-bg: rgba(255, 245, 248, 0.94);
      --card-border: rgba(255,255,255,0.85);
      --shadow: rgba(180, 80, 100, 0.12);
      
      /* Gift Box */
      --box-color: #e56b8a;
      --box-dark: #c94a6a;
      --lid-color: #f07a95;
      --ribbon: #f8c8dc;
      --ribbon-dark: #f2b0c8;
      --glow-color: rgba(224, 138, 158, 0.5);
      --shadow-color: rgba(140, 40, 70, 0.25);
      
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; } html { scroll-behavior: smooth; }
    body { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(145deg, var(--bg-start), var(--bg-end)); background-size: 300% 300%; animation: bgShift 14s ease infinite; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; position: relative; color: var(--text-primary); }
    @keyframes bgShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
    
    /* Floating Hearts */
    .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .heart { position: absolute; width: 16px; height: 16px; background: var(--accent); transform: rotate(45deg); opacity: 0; animation: float 9s ease-in-out infinite; }
    .heart::before, .heart::after { content: ''; position: absolute; width: 16px; height: 16px; background: inherit; border-radius: 50%; }
    .heart::before { top: -8px; left: 0; } .heart::after { top: 0; left: -8px; }
    .heart:nth-child(1) { left: 10%; animation-delay: 0s; background: #e56b8a; } .heart:nth-child(1)::before, .heart:nth-child(1)::after { background: #e56b8a; }
    .heart:nth-child(2) { left: 26%; animation-delay: 1.4s; }
    .heart:nth-child(3) { left: 45%; animation-delay: 3.1s; background: #d4788e; } .heart:nth-child(3)::before, .heart:nth-child(3)::after { background: #d4788e; }
    .heart:nth-child(4) { left: 62%; animation-delay: 1.1s; background: #c45b72; } .heart:nth-child(4)::before, .heart:nth-child(4)::after { background: #c45b72; }
    .heart:nth-child(5) { left: 78%; animation-delay: 3.4s; }
    .heart:nth-child(6) { left: 92%; animation-delay: 2.2s; background: #d4788e; } .heart:nth-child(6)::before, .heart:nth-child(6)::after { background: #d4788e; }
    @keyframes float { 0%{transform:rotate(45deg) translateY(110vh) scale(0.3);opacity:0} 15%{opacity:0.5} 50%{opacity:0.3} 100%{transform:rotate(45deg) translateY(-20vh) scale(0.8);opacity:0} }
    
    #sparkles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    
    /* Cinematic White Flash Overlay */
    #flash-overlay {
      position: fixed; inset: 0; background: #ffffff;
      opacity: 0; pointer-events: none; z-index: 20;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Gift Screen */
    #gift-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: inherit; transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1), transform 0.9s cubic-bezier(0.4,0,0.2,1); }
    #gift-screen.hidden { opacity: 0; transform: scale(1.08) translateY(24px); pointer-events: none; }
    .tap-hint { margin-top: 36px; font-size: 0.82rem; color: var(--text-soft); letter-spacing: 2.5px; text-transform: uppercase; opacity: 0.6; animation: breathe 2.5s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:0.4;transform:translateY(0)} 50%{opacity:0.9;transform:translateY(-3px)} }
    
    .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; overflow: hidden; }
    .confetti { position: absolute; border-radius: 2px; animation: burst 1.4s cubic-bezier(0.25,0.8,0.25,1) forwards; }
    @keyframes burst { 0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(0.2) rotate(var(--rot));opacity:0} }
    
    /* 3D Gift */
    .scene { perspective: 900px; z-index: 2; }
    .gift-wrapper { position: relative; width: 140px; height: 130px; transform: rotateY(-30deg) rotateX(8deg); transform-style: preserve-3d; transition: transform 0.5s var(--bounce); cursor: pointer; animation: pulse-glow 3.5s ease-in-out infinite; }
    @keyframes pulse-glow { 0%,100%{filter:drop-shadow(0 0 12px var(--glow-color))} 50%{filter:drop-shadow(0 0 26px var(--accent))} }
    .gift-wrapper:hover { transform: rotateY(-30deg) rotateX(8deg) rotateZ(5deg) scale(1.07) translateY(-6px); filter: drop-shadow(0 0 32px var(--accent-dark)); }
    .gift-wrapper.open { animation: none; transform: rotateY(-30deg) rotateX(8deg) scale(1.05) translateY(10px); }
    .box { position: absolute; bottom: 0; width: 100%; height: 90px; background: linear-gradient(135deg, var(--box-color), var(--box-dark)); border-radius: 6px 6px 10px 10px; box-shadow: 0 15px 25px var(--shadow-color); }
    .box .ribbon { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 22px; height: 100%; background: linear-gradient(135deg, var(--ribbon), var(--ribbon-dark)); border-radius: 2px; }
    .lid { position: absolute; top: -5px; left: -5%; width: 110%; height: 35px; background: linear-gradient(135deg, var(--lid-color), #c94a6a); border-radius: 6px; box-shadow: 0 5px 12px var(--shadow-color); transform-origin: 50% 0%; transition: transform 0.7s var(--bounce); z-index: 10; }
    .lid .ribbon { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 26px; height: 100%; background: linear-gradient(135deg, var(--ribbon), var(--ribbon-dark)); border-radius: 2px; }
    .bow { position: absolute; top: -18px; left: 50%; transform: translateX(-50%) translateZ(20px); width: 40px; height: 22px; z-index: 11; }
    .bow::before, .bow::after { content:''; position:absolute; top:50%; width:22px; height:16px; background:var(--ribbon); border-radius:50% 50% 0 50%; box-shadow:0 2px 6px rgba(120,50,70,0.2); }
    .bow::before { left:-4px; transform:translateY(-50%) rotate(-35deg); }
    .bow::after { right:-4px; transform:translateY(-50%) rotate(35deg) scaleX(-1); }
    .shadow { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%) rotateX(85deg); width: 130px; height: 30px; background: var(--shadow-color); border-radius: 50%; filter: blur(6px); transition: all 0.5s ease; z-index: -1; }
    .gift-wrapper.open .lid { transform: rotateX(-100deg) translateY(-18px); }
    
    /* Main Content */
    #main-content { width: 92%; max-width: 820px; padding: 24px; z-index: 2; opacity: 0; transform: translateY(36px) scale(0.96); transition: opacity 0.8s ease, transform 0.8s ease; }
    #main-content.visible { opacity: 1; transform: translateY(0) scale(1); }
    .slideshow-card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 28px; padding: 44px 28px 24px; box-shadow: 0 28px 70px var(--shadow), 0 0 0 1px rgba(255,255,255,0.7) inset; position: relative; min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 44px 28px 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transform: translateY(20px) rotateX(6deg); transition: opacity 0.7s cubic-bezier(0.4,0,0.2,1), transform 0.7s cubic-bezier(0.4,0,0.2,1); pointer-events: none; perspective: 800px; overflow-y: auto; }
    .slide.active { opacity: 1; transform: translateY(0) rotateX(0deg); pointer-events: auto; }
    .slide::-webkit-scrollbar { width: 4px; } .slide::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    .slide h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.9rem, 5.5vw, 2.6rem); font-weight: 600; margin-bottom: 14px; color: var(--accent-dark); line-height: 1.15; text-shadow: 0 2px 8px rgba(180,80,100,0.15); }
    .letter-text { font-size: clamp(1rem, 2.6vw, 1.14rem); line-height: 1.9; color: var(--text-primary); max-width: 86%; margin: 0 auto 16px; min-height: 80px; font-weight: 300; white-space: pre-line; opacity: 0; transition: opacity 0.5s ease; }
    .slide.active .letter-text { opacity: 1; }
    .divider { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 12px auto 18px; border-radius: 2px; }
    .photo-polaroid { background: #fff; padding: 12px 12px 50px; box-shadow: 0 14px 32px rgba(0,0,0,0.08); transform: rotate(-3deg); transition: transform 0.3s ease; margin: 8px auto 18px; }
    .photo-polaroid:hover { transform: rotate(0deg) scale(1.02); }
    .photo-polaroid img { width: 260px; max-width: 85vw; display: block; border-radius: 3px; }
    .video-wrapper { width: 100%; max-width: 540px; margin: 12px auto; border-radius: 18px; overflow: hidden; box-shadow: 0 14px 32px rgba(0,0,0,0.08); background: #1a1a1a; aspect-ratio: 16/9; }
    .video-wrapper video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--card-bg); border: 1px solid var(--card-border); width: 44px; height: 44px; border-radius: 50%; font-size: 1.5rem; color: var(--accent-dark); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px var(--shadow); transition: all 0.25s ease; z-index: 5; }
    .nav-btn:hover { transform: translateY(-50%) scale(1.12); background: #fff; } .nav-btn:active { transform: translateY(-50%) scale(0.94); }
    .prev { left: 18px; } .next { right: 18px; }
    .dots { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 5; pointer-events: auto; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #e8d0d6; cursor: pointer; transition: all 0.35s ease; }
    .dot.active { background: var(--accent); transform: scale(1.6); box-shadow: 0 0 0 4px rgba(212,120,142,0.25); }
    .progress-bar { position: absolute; bottom: 0; left: 0; height: 3.5px; background: linear-gradient(90deg, var(--accent), #e8b8c4); width: 0%; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); border-radius: 0 4px 4px 0; }
    @media (max-width: 660px) { .slideshow-card { padding: 28px 16px 18px; min-height: 460px; border-radius: 22px; } .slide { padding: 28px 16px 55px; } .nav-btn { width: 36px; height: 36px; font-size: 1.2rem; } .prev { left: 10px; } .next { right: 10px; } .letter-text { max-width: 98%; } .gift-wrapper { width: 125px; height: 115px; } .box { height: 80px; } .lid { height: 32px; } .tap-hint { margin-top: 28px; font-size: 0.75rem; } }
  </style>
</head>

  <script>
    const canvas = document.getElementById('sparkles'); const ctx = canvas.getContext('2d'); let sparkles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();
    function createSparkle(x, y) { const count = 12 + Math.floor(Math.random() * 8); for (let i = 0; i < count; i++) { const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5; const speed = 1.5 + Math.random() * 3; sparkles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, decay: 0.02 + Math.random() * 0.03, size: 2 + Math.random() * 3, hue: 330 + Math.random() * 40 }); } }
    function drawSparkles() { ctx.clearRect(0, 0, canvas.width, canvas.height); sparkles = sparkles.filter(s => { s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life -= s.decay; if (s.life <= 0) return false; ctx.globalAlpha = s.life * 0.8; ctx.fillStyle = `hsl(${s.hue}, 70%, 85%)`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2); ctx.fill(); return true; }); requestAnimationFrame(drawSparkles); }
    drawSparkles();

    const giftScreen = document.getElementById('gift-screen'); const giftBox = document.getElementById('gift-box'); const mainContent = document.getElementById('main-content'); const confettiContainer = document.getElementById('confetti'); const flashOverlay = document.getElementById('flash-overlay');
    function spawnConfetti() { const colors = ['#d4788e', '#e56b8a', '#f8c8dc', '#ffffff', '#b35a72', '#ffdde6']; const shapes = ['circle', 'rect']; for (let i = 0; i < 55; i++) { const c = document.createElement('div'); c.className = 'confetti'; const w = 6 + Math.random() * 8; const h = shapes[Math.floor(Math.random()*2)] === 'circle' ? w : w * (1 + Math.random()); c.style.width = w + 'px'; c.style.height = h + 'px'; c.style.background = colors[Math.floor(Math.random() * colors.length)]; c.style.borderRadius = shapes[Math.floor(Math.random()*2)] === 'circle' ? '50%' : '2px'; c.style.left = '50%'; c.style.top = '45%'; c.style.setProperty('--tx', (Math.random() - 0.5) * window.innerWidth * 0.9 + 'px'); c.style.setProperty('--ty', (Math.random() - 0.6) * window.innerHeight * 0.5 + 'px'); c.style.setProperty('--rot', (Math.random() - 0.5) * 720 + 'deg'); c.style.animationDelay = (Math.random() * 0.25) + 's'; confettiContainer.appendChild(c); } setTimeout(() => confettiContainer.innerHTML = '', 1600); }

    giftBox.addEventListener('click', () => {
      giftBox.classList.add('open'); spawnConfetti();
      
      // 1. Flash hits full white
      flashOverlay.style.transition = 'opacity 0.8s ease-in';
      flashOverlay.style.opacity = '1';
      
      setTimeout(() => {
        // 2. Hide gift and bring in content behind the white
        giftScreen.style.display = 'none'; 
        mainContent.classList.add('visible');
        initSlideshow();
        
        // 3. START TYPING IMMEDIATELY (while screen is still solid white)
        const letter = slides[0]?.querySelector('.letter-text');
        if (letter && letter.dataset.text) typeWriter(letter, 0); 
        
        // 4. WAIT while it types in the dark, then start a very slow fade out
        // We wait 2 seconds, then fade out over 4 seconds.
        setTimeout(() => {
          flashOverlay.style.transition = 'opacity 4.0s cubic-bezier(0.4, 0, 0.2, 1)';
          flashOverlay.style.opacity = '0';
          createSparkle(window.innerWidth/2, window.innerHeight/2);
        }, 2000); 
      }, 1000); 
    });

    let current = 0; let slides = []; let dots = []; let isAnimating = false; let twTimer = null;
    const progressBar = document.querySelector('.progress-bar');

    function initSlideshow() {
      if (dots.length > 0) return; // Prevent double init
      slides = document.querySelectorAll('.slide');
      const dotsCont = document.querySelector('.dots');
      slides.forEach((_, i) => { const dot = document.createElement('div'); dot.className = `dot ${i === 0 ? 'active' : ''}`; dot.addEventListener('click', () => goToSlide(i)); dotsCont.appendChild(dot); dots.push(dot); });
      updateProgress();
      document.querySelector('.prev').addEventListener('click', () => changeSlide(-1));
      document.querySelector('.next').addEventListener('click', () => changeSlide(1));
      let startX = 0; const card = document.querySelector('.slideshow-card');
      card.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
      card.addEventListener('touchend', e => { const diff = startX - e.changedTouches[0].clientX; if (Math.abs(diff) > 45) changeSlide(diff > 0 ? 1 : -1); }, {passive: true});
    }

    function changeSlide(dir) {
      if (isAnimating) return; isAnimating = true;
      let next = current + dir; if (next < 0) next = slides.length - 1; if (next >= slides.length) next = 0;
      goToSlide(next); setTimeout(() => isAnimating = false, 650);
    }

    function goToSlide(index) {
      if (index === current) return;
      slides[current].classList.remove('active'); dots[current].classList.remove('active');
      current = index; slides[current].classList.add('active'); dots[current].classList.add('active');
      updateProgress();
      const letter = slides[current].querySelector('.letter-text');
      if (letter && letter.dataset.text) typeWriter(letter, 350);
    }

    function updateProgress() { const pct = ((current + 1) / slides.length) * 100; progressBar.style.width = pct + '%'; }

    function typeWriter(el, startDelay = 0) {
      if (twTimer) clearTimeout(twTimer);
      el.textContent = '';
      const text = el.dataset.text || '';
      let i = 0; const speed = 20;
      twTimer = setTimeout(() => {
        function type() {
          if (i < text.length) { el.textContent += text.charAt(i); i++; twTimer = setTimeout(type, speed); }
        }
        type();
      }, startDelay);
    }

    document.addEventListener('keydown', e => { if (!mainContent.classList.contains('visible')) return; if (e.key === 'ArrowLeft') changeSlide(-1); if (e.key === 'ArrowRight') changeSlide(1); });
</script>
